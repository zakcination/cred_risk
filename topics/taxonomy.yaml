# =============================================================================
# Credit-Risk Topic Taxonomy
# =============================================================================
# Taxonomy of subject areas ("topics") used to classify credit-risk / prudential
# supervision documents of a second-tier bank in Kazakhstan (AO "Eurasian Bank").
#
# The taxonomy was bootstrapped by scanning the initial document set:
#   - Supervisory Stress-Testing Report of banks (НСТ) 2025
#   - Recommendatory Measure of Supervisory Response (RMNR) / SREP-2025
#   - Written Prescription (Письменное предписание) re Rules No.188
#   - Top-20 credit exposures register (xlsx)
#   - Internal Audit Report No.7 on credit-risk management
#
# Each topic carries weighted signal terms. Matching is case-insensitive and
# Unicode-aware (Russian/Kazakh/English). Terms are matched on word boundaries;
# multi-word phrases are matched as substrings after whitespace normalisation.
#
# weight semantics (per matched term):
#   strong : 3.0  -> highly specific to the topic (near-unique)
#   medium : 1.5  -> characteristic but shared with neighbouring topics
#   weak   : 0.5  -> supportive context, generic on its own
#
# Add new topics or terms as new documents arrive; keep ids stable.
# =============================================================================

version: 1
language: [ru, kk, en]

topics:

  - id: aqr
    name_ru: "Оценка качества активов (AQR)"
    name_en: "Asset Quality Review (AQR)"
    description: >
      Independent point-in-time review of asset quality, provisioning adequacy
      and risk-metric starting points that feeds the stress-testing perimeter.
    strong: ["AQR", "оценка качества активов", "asset quality review", "периметр AQR", "по результатам AQR"]
    medium: ["коэффициент покрытия провизиями", "стартовая точка", "покрытие провизиями"]
    weak: ["провизии", "коэффициент покрытия"]

  - id: supervisory_stress_testing
    name_ru: "Надзорное стресс-тестирование (НСТ)"
    name_en: "Supervisory Stress Testing (SST/НСТ)"
    description: >
      Agency's annual macro stress test of the capital adequacy of the largest
      banks under baseline and stress scenarios over a 12-quarter horizon.
    strong: ["надзорное стресс-тестировани*", "стресс-тестировани*", "стресс-тест*", "НСТ", "НТС", "стрессовый сценарий", "стрессовых сценари*", "базовый сценарий"]
    medium: ["сценарии НСТ", "горизонт НСТ", "12 кварталов", "реверсивный стресс-тест", "обратное стресс-тестировани*", "стресс-сценари*", "макросценарий"]
    weak: ["сценарий", "сценария", "сценариев", "стресс", "прогнозный горизонт"]

  - id: srep
    name_ru: "Ежегодная надзорная оценка (SREP)"
    name_en: "Supervisory Review and Evaluation Process (SREP)"
    description: >
      Annual risk-based supervisory assessment of the bank; source of the
      supervisory findings, ratings (СОР) and follow-up measures.
    strong: ["SREP", "Supervisory Review and Evaluation Process", "ежегодная надзорная оценка", "надзорный процесс", "риск-ориентированный подход"]
    medium: ["надзорная оценка", "итоговый рейтинг СОР", "заключение по результатам SREP"]
    weak: ["Агентство", "надзор"]

  - id: supervisory_response_recommendatory
    name_ru: "Рекомендательная мера надзорного реагирования (РМНР)"
    name_en: "Recommendatory Measure of Supervisory Response (RMNR)"
    description: >
      Soft supervisory measure listing deficiencies/risks that do not materially
      threaten financial stability; recommends remediation (Art. 79).
    strong: ["рекомендательная мера надзорного реагирования", "РМНР", "RMNR", "статья 79", "статьей 79"]
    medium: ["рекомендательные меры", "рекомендует Банку", "устранение выявленных недостатков", "мотивированное суждение"]
    weak: ["рекомендация", "недостатки", "рекомендует"]

  - id: supervisory_response_prescription
    name_ru: "Письменное предписание"
    name_en: "Written Prescription (enforcement)"
    description: >
      Binding supervisory enforcement act ordering the bank to remedy specific
      rule violations by a deadline, under Rules No.272.
    strong: ["письменное предписание", "предписывает Банку", "меры надзорного реагирования", "Правила №272", "Правилами №272"]
    medium: ["нарушения норм", "устранение вышеуказанных нарушений", "план мероприятий", "санкции"]
    weak: ["нарушение", "предписание", "срок"]

  - id: risk_appetite
    name_ru: "Риск-аппетит"
    name_en: "Risk Appetite"
    description: >
      Statement and quantitative/qualitative levels of risk the bank is willing
      to accept; calibration, monitoring and integration into planning.
    strong: ["риск-аппетит", "заявление риск-аппетита", "уровни риск-аппетита", "risk appetite", "риск-аппетита"]
    medium: ["корректирующих мер", "калибровка", "допустимый уровень", "заявление качественного характера"]
    weak: ["аппетит", "уровень риска"]

  - id: icaap_ilaap
