    name_en: "ICAAP / ILAAP"
    description: >
      Internal Capital Adequacy Assessment Process (ВПОДК) and Internal
      Liquidity Adequacy Assessment Process (ВПОДЛ) and reporting on compliance.
    strong: ["ВПОДК", "ВПОДЛ", "ICAAP", "ILAAP", "соблюдению ВПОДК"]
    medium: ["отчет о соблюдении", "оценка достаточности капитала", "оценка достаточности ликвидности"]
    weak: ["достаточность капитала", "достаточность ликвидности"]

  - id: top20_large_exposures
