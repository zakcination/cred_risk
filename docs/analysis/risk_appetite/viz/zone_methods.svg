<text x="432.4" y="333.3" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">М2 тренд</text>
<text x="788.0" y="60.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">Как читать</text>
<text x="788.0" y="82.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">Ось X — жёлтая линия метода.</text>
<text x="788.0" y="99.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">Ось Y — доля времени в жёлтой зоне.</text>
<text x="788.0" y="116.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">Метод правее лимита переворачивается:</text>
<text x="788.0" y="133.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">жёлтая выше красной — зоны нет.</text>
<text x="788.0" y="150.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">H и C сходятся в 0,05 пп — это</text>
<text x="788.0" y="167.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">независимое подтверждение:</text>
<text x="788.0" y="184.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">C смотрит на распределение,</text>
<text x="788.0" y="201.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">H — на длину процесса.</text>
<text x="64.0" y="26.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">Восемь методов калибровки на одном стенде</text>
<text x="64.0" y="43.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">Метод, защищаемый в собственных терминах, несравним с другим. Общая шкала — жёлтая линия и доля времени</text>
</svg>