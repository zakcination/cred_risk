<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1015" viewBox="0 0 1180 1015" role="img" aria-label="Цепочка риск-аппетита и её фактические разрывы">
<defs>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ca30c"/></marker>
<marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fab219"/></marker>
<marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d03b3b"/></marker>
</defs>
<rect width="1180" height="1015" fill="#fcfcfb"/>
<text x="56" y="52" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="600" fill="#0b0b0b">Цепочка риск-аппетита и её фактические разрывы</text>
<text x="56" y="80" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5b5b58">АО «Евразийский банк», контур кредитного риска, на 20.08.2026. Ссылки — на пункты нормативных актов и на реестр находок FINDINGS_RA.md.</text>
<line x1="56" y1="98" x2="1124" y2="98" stroke="#d8d8d3" stroke-width="1"/>
<rect x="56" y="114" width="11" height="11" rx="2.5" fill="#0ca30c"/>
<text x="74" y="124" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b5b58">звено есть</text>
<rect x="151.0" y="114" width="11" height="11" rx="2.5" fill="#fab219"/>
<text x="169.0" y="124" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b5b58">есть с оговоркой</text>
<rect x="288.6" y="114" width="11" height="11" rx="2.5" fill="#d03b3b"/>
<text x="306.6" y="124" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b5b58">отсутствует</text>
<text x="1124" y="124" text-anchor="end" font-family="'SF Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b5b58">viz/chain_svg.py</text>
<rect x="56" y="152" width="400" height="78" rx="7" fill="#fbf0f0" stroke="#d03b3b" stroke-width="1.4"/>
<rect x="56" y="152" width="4.5" height="78" rx="2" fill="#d03b3b"/>
<text x="76" y="176" font-family="'SF Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b5b58">1</text>
<text x="98" y="176" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="600" fill="#0b0b0b">Риск-ёмкость</text>
<text x="98" y="201" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#5b5b58">внешняя граница: капитал, ликвидность, нормативы</text>
<text x="512" y="172" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b5b58"><tspan font-weight="400">Как отдельная величина </tspan><tspan font-weight="600" fill="#0b0b0b">не зафиксирована</tspan><tspan font-weight="400"> — Г12.</tspan></text>
<text x="512" y="193" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b5b58"><tspan font-weight="400">Регуляторные минимумы по № 85 есть: k1 8,0 %, k1-2 9,0 %, k2 10,5 %.</tspan></text>
<text x="512" y="214" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b5b58"><tspan font-weight="400">Буфер до лимита РА — ровно 0,5 пп по всем трём коэффициентам: это</tspan></text>
<text x="512" y="231" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b5b58"><tspan font-weight="400">механическая надбавка, а не результат калибровки.</tspan></text>
<line x1="256" y1="230" x2="256" y2="243" stroke="#d03b3b" stroke-width="2.2"/>
<line x1="248" y1="250" x2="264" y2="244" stroke="#d03b3b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="248" y1="257" x2="264" y2="251" stroke="#d03b3b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="256" y1="264" x2="256" y2="282" stroke="#d03b3b" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#a-bad)"/>
<text x="272" y="262" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#d03b3b">связи нет</text>
<rect x="56" y="282" width="400" height="78" rx="7" fill="#fdf6e7" stroke="#fab219" stroke-width="1.4"/>
<rect x="56" y="282" width="4.5" height="78" rx="2" fill="#fab219"/>
<text x="76" y="306" font-family="'SF Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b5b58">2</text>
<text x="98" y="306" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="600" fill="#0b0b0b">Риск-аппетит</text>
<text x="98" y="331" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#5b5b58">25 метрик, из них 14 кредитных</text>
<text x="512" y="302" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b5b58"><tspan font-weight="400">Заявление риск-аппетита </tspan><tspan font-weight="600" fill="#0b0b0b">как отдельный документ не предъявлено</tspan><tspan font-weight="400"> — вопрос</tspan></text>
<text x="512" y="319" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b5b58"><tspan font-weight="400">В34.</tspan></text>
<text x="512" y="340" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b5b58"><tspan font-weight="400">Для 14 кредитных метрик связь с риск-ёмкостью не прослеживается ни в одном</tspan></text>
<text x="512" y="357" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b5b58"><tspan font-weight="400">из прочитанных ВНД.</tspan></text>
<line x1="256" y1="360" x2="256" y2="412" stroke="#fab219" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#a-warn)"/>
<text x="272" y="392" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#fab219">калибровка от факта</text>
<rect x="56" y="412" width="400" height="78" rx="7" fill="#f0f8f0" stroke="#0ca30c" stroke-width="1.4"/>
<rect x="56" y="412" width="4.5" height="78" rx="2" fill="#0ca30c"/>
<text x="76" y="436" font-family="'SF Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b5b58">3</text>
<text x="98" y="436" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="600" fill="#0b0b0b">Лимит</text>
<text x="98" y="461" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#5b5b58">установлен по всем 25 метрикам</text>
<text x="512" y="432" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b5b58"><tspan font-weight="600" fill="#0b0b0b">Единственное звено, которое есть целиком.</tspan></text>
<text x="512" y="453" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b5b58"><tspan font-weight="400">Но происхождение уровня восстановлено ровно для одного лимита из 25:</tspan></text>
<text x="512" y="470" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b5b58"><tspan font-weight="400">топ-20, февраль 2023, 250 % → 95 %, то есть факт + 7 σ — Г17.</tspan></text>
<line x1="256" y1="490" x2="256" y2="503" stroke="#d03b3b" stroke-width="2.2"/>
<line x1="248" y1="510" x2="264" y2="504" stroke="#d03b3b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="248" y1="517" x2="264" y2="511" stroke="#d03b3b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="256" y1="524" x2="256" y2="542" stroke="#d03b3b" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#a-bad)"/>
<text x="272" y="522" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#d03b3b">звена нет</text>
<rect x="56" y="542" width="400" height="78" rx="7" fill="#fbf0f0" stroke="#d03b3b" stroke-width="1.4"/>
<rect x="56" y="542" width="4.5" height="78" rx="2" fill="#d03b3b"/>
<text x="76" y="566" font-family="'SF Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b5b58">4</text>
<text x="98" y="563" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="600" fill="#0b0b0b">Уровень, определённый как</text>
<text x="98" y="582" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="600" fill="#0b0b0b">допустимый</text>
<text x="98" y="607" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#5b5b58">п. 18 пп. 2 Правил № 86</text>
<text x="512" y="562" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b5b58"><tspan font-weight="400">По всем </tspan><tspan font-weight="600" fill="#0b0b0b">14 кредитным метрикам отсутствует</tspan><tspan font-weight="400">.</tspan></text>
<text x="512" y="583" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b5b58"><tspan font-weight="400">Там, где зоны есть — капитал и ликвидность, — они стоят за лимитом:</tspan></text>
<text x="512" y="600" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b5b58"><tspan font-weight="400">красная зона наступает уже после его нарушения — Р1.</tspan></text>
<line x1="256" y1="620" x2="256" y2="633" stroke="#d03b3b" stroke-width="2.2"/>
<line x1="248" y1="640" x2="264" y2="634" stroke="#d03b3b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="248" y1="647" x2="264" y2="641" stroke="#d03b3b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="256" y1="654" x2="256" y2="672" stroke="#d03b3b" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#a-bad)"/>
<text x="272" y="652" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#d03b3b">запускать нечем</text>
<rect x="56" y="672" width="400" height="78" rx="7" fill="#fbf0f0" stroke="#d03b3b" stroke-width="1.4"/>
<rect x="56" y="672" width="4.5" height="78" rx="2" fill="#d03b3b"/>
<text x="76" y="696" font-family="'SF Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b5b58">5</text>
<text x="98" y="696" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="600" fill="#0b0b0b">Мера реагирования</text>
<text x="98" y="721" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#5b5b58">перечень действий под каждый уровень</text>
<text x="512" y="692" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b5b58"><tspan font-weight="400">Перечня мер нет, протокола эскалации нет: кто, в какой срок и кого</tspan></text>
<text x="512" y="709" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b5b58"><tspan font-weight="400">уведомляет при приближении — не определено.</tspan></text>
<text x="512" y="730" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b5b58"><tspan font-weight="400">Графы 6, 9, 10 Таблицы 2 приложения к Структуре отчёта по ВПОДК не</tspan></text>
<text x="512" y="747" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b5b58"><tspan font-weight="400">заполнены.</tspan></text>
<line x1="256" y1="750" x2="256" y2="763" stroke="#d03b3b" stroke-width="2.2"/>
<line x1="248" y1="770" x2="264" y2="764" stroke="#d03b3b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="248" y1="777" x2="264" y2="771" stroke="#d03b3b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="256" y1="784" x2="256" y2="802" stroke="#d03b3b" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#a-bad)"/>
<text x="272" y="782" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#d03b3b">контролировать нечего</text>
<rect x="56" y="802" width="400" height="78" rx="7" fill="#fdf6e7" stroke="#fab219" stroke-width="1.4"/>
<rect x="56" y="802" width="4.5" height="78" rx="2" fill="#fab219"/>
<text x="76" y="826" font-family="'SF Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b5b58">6</text>
<text x="98" y="826" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="600" fill="#0b0b0b">Контроль</text>
<text x="98" y="851" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#5b5b58">отчёт об уровнях, ежеквартально</text>
<text x="512" y="822" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b5b58"><tspan font-weight="400">Отчёт есть, но фиксирует факт против лимита — без сигнального уровня и без</tspan></text>
<text x="512" y="839" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b5b58"><tspan font-weight="400">мер.</tspan></text>
<text x="512" y="860" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b5b58"><tspan font-weight="400">По топ-20 недельный ряд ведётся с 2016 года и в отчётность с этой частотой</tspan></text>
<text x="512" y="877" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b5b58"><tspan font-weight="400">не попадает: контроль медленнее данных.</tspan></text>
<rect x="56" y="914" width="1068" height="79" rx="7" fill="#fbf0f0" stroke="#d03b3b" stroke-width="1"/>
<text x="74" y="940" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#0b0b0b"><tspan font-weight="600" fill="#0b0b0b">Следствие.</tspan><tspan font-weight="400"> За девять кварталов из 14 кредитных лимитов сработал один — и сразу нарушением, без предупреждения:</tspan></text>
<text x="74" y="959" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#5b5b58"><tspan font-weight="400">75,62 % → 92,66 % → 101,50 % при лимите 95 %. Цепочка, в которой отсутствуют звенья 1, 4 и 5, не может сработать</tspan></text>
<text x="74" y="978" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#5b5b58"><tspan font-weight="400">раньше пробоя: предупреждать попросту нечем.</tspan></text>
</svg>