орные акты дают определения и списки,</text><text x="30" y="940" font-family="Arial" font-size="13" fill="#5b6b7a" font-weight="normal" text-anchor="start">без которых верхние не считаются. Лента внизу — путь нашего кейса; красная зона наступает только при</text><text x="30" y="960" font-family="Arial" font-size="13" fill="#5b6b7a" font-weight="normal" text-anchor="start">закрытии счётчика № 119 либо срыве плана (тогда — сразу режим восстановления, № 119 п. 16 пп. 6).</text></svg>